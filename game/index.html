<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Bay — Open-World Crime Game</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1210; font-family: 'Segoe UI', Arial, sans-serif; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 5; }
#top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
#stars { font-size: 26px; letter-spacing: 4px; color: #ffd23e; }
#stars.hot { color: #ff5533; animation: pulse 0.7s infinite alternate; }
@keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
#cash { font-size: 26px; font-weight: bold; color: #7dff8a; }
#health-wrap { margin-top: 6px; width: 190px; margin-left: auto; }
#health-bar { height: 12px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.6); border-radius: 6px; overflow: hidden; }
#health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2ecc71, #7dff8a); }
#health-fill.low { background: linear-gradient(90deg, #e74c3c, #ff8866); }
#health-text { font-size: 12px; }
#objective-box { position: absolute; top: 14px; left: 16px; max-width: 430px; background: rgba(0,0,0,0.45); border-left: 4px solid #ffd23e; padding: 10px 14px; border-radius: 4px; }
#objective { font-size: 16px; font-weight: bold; }
#objective-dist { font-size: 13px; color: #ffd23e; }
#district { position: absolute; bottom: 14px; left: 16px; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
#speed { position: absolute; bottom: 40px; right: 18px; font-size: 30px; font-weight: bold; }
#message { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); max-width: 640px; text-align: center; font-size: 19px; background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 6px; opacity: 0; transition: opacity 0.4s; }
#message.show { opacity: 1; }
#minimap { position: absolute; left: 16px; bottom: 44px; width: 184px; height: 184px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; background: rgba(10,16,26,0.8); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: none; }
#crosshair:before, #crosshair:after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
#crosshair:before { left: 10px; top: 0; width: 2px; height: 22px; }
#crosshair:after { left: 0; top: 10px; width: 22px; height: 2px; }
#hint { position: absolute; bottom: 14px; right: 18px; font-size: 12px; opacity: 0.75; }
#menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(30,16,40,0.82), rgba(120,50,20,0.78)); color: #fff; z-index: 10; text-align: center; padding: 20px; }
#menu h1 { font-size: 72px; margin: 0; letter-spacing: 8px; color: #ffd23e; text-shadow: 0 4px 0 #c0392b, 0 8px 24px rgba(0,0,0,0.6); }
#menu h2 { font-size: 20px; margin: 4px 0 18px 0; letter-spacing: 4px; color: #ffb199; }
#menu-story { max-width: 620px; font-size: 16px; line-height: 1.5; margin-bottom: 10px; }
#menu-progress { font-size: 14px; color: #ffd23e; margin-bottom: 18px; }
#controls-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 26px; text-align: left; font-size: 14px; margin-bottom: 22px; background: rgba(0,0,0,0.35); padding: 14px 20px; border-radius: 8px; }
#controls-list b { color: #ffd23e; }
.menu-btn { pointer-events: auto; cursor: pointer; font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #1a1210; background: #ffd23e; border: none; border-radius: 8px; padding: 14px 42px; margin: 4px; box-shadow: 0 4px 0 #b89a1e; }
.menu-btn:hover { background: #ffe27a; }
.menu-btn.secondary { background: #fff; box-shadow: 0 4px 0 #999; }
#overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.72); color: #fff; z-index: 9; text-align: center; }
#overlay-title { font-size: 64px; letter-spacing: 10px; color: #ff5533; margin: 0; text-shadow: 0 4px 18px rgba(0,0,0,0.8); }
#overlay-sub { font-size: 18px; margin: 12px 0 24px 0; max-width: 520px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
<div id="objective-box"><div id="objective">Loading Sunset Bay…</div><div id="objective-dist"></div></div>
<div id="top-right">
<div id="stars">☆☆☆☆☆</div>
<div id="cash">$250</div>
<div id="health-wrap"><div id="health-bar"><div id="health-fill"></div></div><div id="health-text">100</div></div>
</div>
<div id="message"></div>
<canvas id="minimap" width="184" height="184"></canvas>
<div id="district">Sunset Plaza</div>
<div id="speed"></div>
<div id="crosshair"></div>
<div id="hint">WASD move &middot; E car &middot; Click shoot &middot; Esc pause</div>
</div>
<div id="menu">
<h1>SUNSET BAY</h1>
<h2>AN OPEN-WORLD CRIME STORY</h2>
<p id="menu-story"></p>
<p id="menu-progress"></p>
<div id="controls-list"></div>
<div>
<button class="menu-btn" id="btn-start">Start Game</button>
<button class="menu-btn secondary" id="btn-continue">Continue</button>
</div>
</div>
<div id="overlay">
<h1 id="overlay-title">BUSTED</h1>
<p id="overlay-sub"></p>
<div>
<button class="menu-btn" id="btn-resume">Keep Playing</button>
<button class="menu-btn secondary" id="btn-restart">New Game</button>
</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
